name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            build_type: Release

          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Release

          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Release

    steps:
    - uses: actions/checkout@v4

    - name: Install latest CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "latest"

    - name: Install modern Clang on Ubuntu
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git clang-18 llvm-18
        sudo apt-get install -y libwebkitgtk-6.0-dev libgtk-4-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
        clang++ --version

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -Dsaucer_no_compiler_version_check=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} || true

    - name: Prepare artifacts
      shell: bash
      run: |
        mkdir -p artifacts
        if [ -d "${{ steps.strings.outputs.build-output-dir }}" ]; then
          find "${{ steps.strings.outputs.build-output-dir }}" -type f \( -executable -o -name "*.exe" -o -name "*.dll" \) -exec cp {} artifacts/ \;
        fi
        if [ ! "$(ls -A artifacts)" ]; then
          cp -r "${{ steps.strings.outputs.build-output-dir }}"/* artifacts/ || true
        fi
        ls -la artifacts/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-${{ matrix.cpp_compiler }}-build
        path: artifacts/
        retention-days: 30
        if-no-files-found: warn